# Ruff configuration for Vinyl Streamer.
#
# Enabled rule set (broadly modern Python defaults):
#   F    pyflakes (undefined names, unused imports, real bugs)
#   E,W  pycodestyle errors and warnings
#   B    flake8-bugbear (likely bugs: mutable defaults, broad except misuse)
#   I    isort (import sorting and grouping)
#   UP   pyupgrade (modern syntax, e.g. PEP 604 unions)
#   SIM  flake8-simplify (collapsing patterns)
#   RUF  ruff-specific lints (dangling tasks, ambiguous unicode, ClassVar)
#   C4   flake8-comprehensions
#   PIE  flake8-pie
#
# We intentionally don't enable D (pydocstyle), N (naming), ANN (typing),
# or ALL. The set above is what's worth blocking PRs on.

line-length = 120
target-version = "py311"

[lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM", "RUF", "C4", "PIE"]

[lint.per-file-ignores]
# wifi_setup.py is mostly a big HTML literal for the captive-portal page.
# The HTML/JS strings inside it have URLs and DOM markup that don't break
# cleanly at 120 columns. Long lines inside that file are intentional.
"wifi_setup.py" = ["E501"]
